name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --config.win.signAndEditExecutable=true --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kandidat-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

      - name: Generate release body
        id: body
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${{ steps.version.outputs.version }}
          cat <<'BODY_EOF' > release_body.md
          ## Kandidat $TAG

          ### Installation

          | Système | Fichier |
          |---------|---------|
          | Windows | `Kandidat Setup ${VERSION}.exe` |
          | macOS | `Kandidat-${VERSION}.dmg` |
          | Linux | `Kandidat-${VERSION}.AppImage` ou `kandidat_${VERSION}_amd64.deb` |

          ### Changelog

          $(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | head -n -1)

          ---
          [README](../../blob/main/README.md) | [Changelog complet](../../blob/main/CHANGELOG.md)
          BODY_EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kandidat ${{ github.ref_name }}
          draft: false
          body_path: release_body.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
